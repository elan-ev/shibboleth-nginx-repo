name: Build Shibboleth Nginx Module for Ubuntu Resolute

on:
  push:
    branches:
      - main
    paths:
      - scripts/ubuntu/resolute/*
      - .github/workflows/ubuntu-resolute-build.yml
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild_shibboleth_modules:
        description: 'Force rebuild Nginx Shibboleth modules'
        required: false
        default: false
        type: boolean

jobs:
  ubuntu-resolute-docker-build:
    name: Build packages for Ubuntu Resolute
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7
        with:
          lfs: true
          sparse-checkout: |
            repo/ubuntu/resolute
            scripts/ubuntu/resolute
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Build Shibboleth Nginx modules for Ubuntu Resolute
        run: >
          docker run --rm
          -v ${{ github.workspace }}/repo/ubuntu/resolute:/repo
          -v ${{ github.workspace }}/scripts/ubuntu/resolute:/scripts:ro
          -e FORCE_REBUILD_SHIBBOLETH_MODULES=$FORCE_REBUILD_SHIBBOLETH_MODULES
          ubuntu:resolute
          /bin/bash /scripts/cron-build-shib-nginx-mod.sh
        env:
          FORCE_REBUILD_SHIBBOLETH_MODULES: ${{ inputs.force_rebuild_shibboleth_modules }}

      - name: Commit build package
        run: |
          git config --global user.name 'GitHub build bot'
          git config --global user.email 'buildbot@users.noreply.github.com'
          (git add repo/ubuntu/resolute/pool/multiverse/*.deb && git commit -m "[automated] Ubuntu Resolute package added" && git pull && git push) || echo "No new packages found, skip updating."
